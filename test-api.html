<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <script src="assets/api-service.js"></script>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h1>API Test Page</h1>
    
    <button onclick="testGetMembers()">Test GET /api/members</button>
    <button onclick="testCreateMember()">Test POST /api/members</button>
    <button onclick="testGetTrainers()">Test GET /api/trainers</button>
    <button onclick="testCreateAppointment()">Test POST /api/appointments</button>
    
    <div id="result" style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px;"></div>
    
    <script>
        async function testGetMembers() {
            try {
                const result = await API.getMembers();
                document.getElementById('result').innerHTML = 
                    `<pre>${JSON.stringify(result, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<pre style="color: red">Error: ${error.message}</pre>`;
            }
        }
        
        async function testCreateMember() {
            const memberData = {
                firstName: "Test",
                lastName: "User",
                email: "test" + Date.now() + "@example.com",
                phone: "0300" + Math.floor(Math.random() * 10000000),
                age: 25,
                gender: "Male",
                membershipType: "Basic"
            };
            
            try {
                const result = await API.createMember(memberData);
                document.getElementById('result').innerHTML = 
                    `<pre>✅ Member Created:\n${JSON.stringify(result, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<pre style="color: red">Error: ${error.message}</pre>`;
            }
        }
        
        async function testGetTrainers() {
            try {
                const result = await API.getTrainers();
                document.getElementById('result').innerHTML = 
                    `<pre>${JSON.stringify(result, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<pre style="color: red">Error: ${error.message}</pre>`;
            }
        }
        
        async function testCreateAppointment() {
            // First get a member
            const members = await API.getMembers();
            if (!members.success || members.data.length === 0) {
                alert('Create a member first');
                return;
            }
            
            // Get trainers
            const trainers = await API.getTrainers();
            if (!trainers.success || trainers.data.length === 0) {
                alert('No trainers available');
                return;
            }
            
            const appointmentData = {
                member: members.data[0]._id,
                trainer: trainers.data[0]._id,
                appointmentDate: new Date().toISOString().split('T')[0],
                startTime: "18:00",
                endTime: "18:30",
                duration: 30,
                serviceType: "Test Appointment",
                status: "Scheduled",
                amount: 0,
                notes: "Test appointment from API test page"
            };
            
            try {
                const result = await API.createAppointment(appointmentData);
                document.getElementById('result').innerHTML = 
                    `<pre>✅ Appointment Created:\n${JSON.stringify(result, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<pre style="color: red">Error: ${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
